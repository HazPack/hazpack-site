<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal | HazPack Compliance Solutions</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183152">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/portal/portal.css">
  <script src="/portal/portal.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="HazPack Compliance Solutions home"><img src="/logo.svg" alt="HazPack Compliance" width="190" height="60"></a>
      <div class="portal-actions" id="actions"><span class="portal-label">Client Portal</span></div>
    </div>
  </header>

  <main class="portal-main" id="main">
    <div class="wrap">
      <div class="auth-card">
        <h1>Client Portal</h1>
        <p class="lead-s">Sign in to see your declarations, invoices and packing photos.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="slug">Company ID</label>
            <input id="slug" name="slug" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Continue</button>
          <p id="status" class="form-status" role="alert"></p>
        </form>
        <p class="auth-foot">Need access? Contact HazPack at <a href="mailto:lax-dgr@hazpackcompliance.com">lax-dgr@hazpackcompliance.com</a>.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-base"><p>&copy; <span id="year">2026</span> HazPack Compliance Solutions. All rights reserved.</p></div>
  </footer>
</body>
</html>
